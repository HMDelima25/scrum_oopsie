<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Set password | HOPE, Inc.</title>
    <link rel="stylesheet" href="/frontend/login/forgot-password/password.css" />
    <link rel="stylesheet" href="/frontend/shared/dialogs/password-guide.css" />
    <script src="/frontend/shared/dialogs/password-guide.js" defer></script>
    <script src="/frontend/login/forgot-password/password.js" defer></script>
  </head>
  <body>
    <main>
      <p>HOPE, Inc.</p>
      <h1>Choose your password</h1>
      <p>
        Use the one-time link from your account setup or password reset message.
      </p>
      <form id="password-form" novalidate>
        <label for="password">New password</label
        ><input
          id="password"
          type="password"
          autocomplete="new-password"
          minlength="12"
          required
          aria-describedby="password-error"
        />
        <p class="auth-inline-error" id="password-error" role="status"></p>
        <label for="confirm">Confirm password</label
        ><input
          id="confirm"
          type="password"
          autocomplete="new-password"
          required
        />
        <p class="auth-inline-error" id="confirm-error" role="status"></p>
        <button type="submit">Save password</button>
      </form>
      <p id="message" role="status" aria-live="polite"></p>
      <p>After saving, return to your HOPE sign-in screen.</p>
    </main>
  </body>
</html>
