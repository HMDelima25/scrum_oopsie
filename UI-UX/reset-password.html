<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Reset password | HOPE, Inc.</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .auth-card.reset-card { display: block; width: min(520px, 100%); margin: auto; }
      .reset-card .auth-panel { width: 100%; }
    </style>
  </head>
  <body>
    <main class="page-shell">
      <section class="auth-card reset-card" aria-labelledby="page-title">
        <div class="auth-panel">
          <a class="brand" href="index.html" aria-label="HOPE, Inc. sign in">
            <span class="brand-mark" aria-hidden="true">
              <span></span><span></span><span></span>
            </span>
            <span class="brand-name">HOPE, Inc.</span>
          </a>

          <div class="auth-content">
            <h1 id="page-title">Set a new password</h1>
            <p class="intro">Choose a new password for your account. It must be at least 8 characters.</p>

            <form id="reset-form" novalidate>
              <div class="field-group">
                <label for="new-password">New password</label>
                <div class="field-shell">
                  <input id="new-password" name="new-password" type="password" autocomplete="new-password" placeholder="Enter a new password" required />
                </div>
                <p class="field-error" id="new-password-error"></p>
              </div>

              <div class="field-group">
                <label for="confirm-new-password">Confirm new password</label>
                <div class="field-shell">
                  <input id="confirm-new-password" name="confirm-new-password" type="password" autocomplete="new-password" placeholder="Repeat the new password" required />
                </div>
                <p class="field-error" id="confirm-new-password-error"></p>
              </div>

              <button class="primary-button" id="reset-submit" type="submit">
                <span>Reset password</span>
              </button>

              <div class="form-message" id="reset-message" role="status" aria-live="polite"></div>
            </form>

            <p class="access-note"><a class="inline-action" href="index.html">Back to sign in</a></p>
          </div>

          <p class="copyright">© 2026 HOPE, Inc. All rights reserved.</p>
        </div>
      </section>
    </main>

    <script src="shared/utilities/api-config.js"></script>
    <script src="reset-password.js"></script>
  </body>
</html>
