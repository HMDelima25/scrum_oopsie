<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Set password | HOPE, Inc.</title>
    <link rel="stylesheet" href="/account/password.css" />
    <script src="/account/password.js" defer></script>
  </head>
  <body>
    <main>
      <p>HOPE, Inc.</p>
      <h1>Choose your password</h1>
      <p>
        Use the one-time link from your account setup or password reset message.
      </p>
      <form id="password-form">
        <label for="password">New password</label
        ><input
          id="password"
          type="password"
          autocomplete="new-password"
          minlength="12"
          required
          aria-describedby="hint"
        />
        <p id="hint">
          At least 12 characters. Passwords are limited to 72 UTF-8 bytes.
        </p>
        <label for="confirm">Confirm password</label
        ><input
          id="confirm"
          type="password"
          autocomplete="new-password"
          required
        />
        <button type="submit">Save password</button>
      </form>
      <p id="message" role="status" aria-live="polite"></p>
      <p>After saving, return to your HOPE sign-in screen.</p>
    </main>
  </body>
</html>
