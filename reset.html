<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Password Reset Test</title>
</head>
<body>
    <h2>1. Request Password Reset</h2>
    <form id="forgotForm">
        <label>Email:</label><br>
        <input type="email" id="forgotEmail" required><br><br>
        <button type="submit">Request Reset Token</button>
    </form>
    <pre id="forgotResponse"></pre>

    <hr>

    <h2>2. Reset Password</h2>
    <form id="resetForm">
        <label>Reset Token:</label><br>
        <input type="text" id="token" required style="width: 300px;"><br><br>

        <label>New Password:</label><br>
        <input type="password" id="newPassword" required><br><br>

        <button type="submit">Reset Password</button>
    </form>
    <pre id="resetResponse"></pre>

    <script>
        // Request Token
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('forgotEmail').value;

            const res = await fetch('http://localhost:5000/api/auth/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });

            const data = await res.json();
            document.getElementById('forgotResponse').textContent = JSON.stringify(data, null, 2);
            if(data.debugToken) {
                document.getElementById('token').value = data.debugToken; // Auto-fill for convenience
            }
        });

        // Submit New Password
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = document.getElementById('token').value;
            const newPassword = document.getElementById('newPassword').value;

            const res = await fetch('http://localhost:5000/api/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, newPassword })
            });

            const data = await res.json();
            document.getElementById('resetResponse').textContent = JSON.stringify(data, null, 2);
        });
    </script>
</body>
</html>
